name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licenses:
    name: License gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: pnpm install --frozen-lockfile
      - name: cargo-deny (licenses and sources)
        run: cargo deny check licenses sources
      - name: cargo-deny (advisories, informational)
        run: cargo deny check advisories
        continue-on-error: true
      - run: pnpm licenses:check
      - name: GPL dependencies fail both gates
        run: pnpm licenses:selftest

  windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      GPU_TEST_SOFTWARE: '1'
      # The FFmpeg integration tests must run here, not skip.
      CGV_REQUIRE_FFMPEG: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - name: Ensure WebView2 Runtime
        run: ./scripts/setup-webview2.ps1
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .tools/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/build-ffmpeg-lgpl.mjs') }}
      - name: LGPL FFmpeg (pinned, hash-checked)
        run: pnpm setup:ffmpeg
      - uses: actions/cache@v4
        with:
          path: tests/media
          key: test-media-${{ hashFiles('tests/media/manifest.json') }}
      - run: pnpm fetch-test-media
      - run: cargo fmt --all --check
      # The generated engine bindings and apps/web/dist are untracked; build them
      # before clippy (Tauri embeds dist), typecheck and the browser tests.
      - run: pnpm build
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p cgv-wasm -p cgv-denoise -p cgv-ai --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --workspace
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      # Browser tests use the runner's installed Chrome (H.264 and AAC included).
      - run: pnpm test:e2e
      - run: pnpm --filter @cgv/desktop build
      - run: pnpm desktop:smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-verification
          path: |
            bench/results/
            playwright-report/
            test-results/
