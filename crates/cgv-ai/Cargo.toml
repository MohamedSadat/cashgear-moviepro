[package]
name = "cgv-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# The AI tools' own WASM module, run in the AI worker: sound and picture
# analysis, Whisper's features and word timing. It loads the first time an AI
# job runs, so none of it counts against the engine's size budget.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cgv-dsp.workspace = true
realfft = "=3.5.0"
sha2 = { version = "=0.10.9", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
