[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop/src-tauri"]
# Plain `cargo build` skips the Tauri shell; `--workspace` includes it.
default-members = [
  "crates/cgv-time",
  "crates/cgv-model",
  "crates/cgv-effects",
  "crates/cgv-text",
  "crates/cgv-media",
  "crates/cgv-render",
  "crates/cgv-dsp",
  "crates/cgv-denoise",
  "crates/cgv-ai",
  "crates/cgv-audio",
  "crates/cgv-engine",
  "crates/cgv-wasm",
  "crates/cgv-native",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-CashGear-Proprietary"
publish = false
rust-version = "1.99.1"

[workspace.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "webgpu", "webgl", "wgsl"] }
naga = { version = "=30.0.1", features = ["wgsl-in"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = "0.3.106"
js-sys = "0.3.106"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustybuzz = "0.20"
unicode-bidi = "0.3"
unicode-linebreak = "0.1"
zeno = "0.3"
cgv-time = { path = "crates/cgv-time" }
cgv-model = { path = "crates/cgv-model" }
cgv-effects = { path = "crates/cgv-effects" }
cgv-text = { path = "crates/cgv-text" }
cgv-media = { path = "crates/cgv-media" }
cgv-render = { path = "crates/cgv-render" }
cgv-dsp = { path = "crates/cgv-dsp" }
cgv-audio = { path = "crates/cgv-audio" }
cgv-engine = { path = "crates/cgv-engine" }
cgv-native = { path = "crates/cgv-native" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The model, the effect catalogue and JSON are mostly serde code, run per edit or
# per frame plan, not per pixel or sample: they are built for size.
[profile.release.package.cgv-model]
opt-level = "s"
[profile.release.package.cgv-effects]
opt-level = "s"
[profile.release.package.serde_json]
opt-level = "s"
# Shaping runs when a title's text or style changes, not per pixel.
[profile.release.package.rustybuzz]
opt-level = "s"
[profile.release.package.unicode-bidi]
opt-level = "s"
[profile.release.package.unicode-linebreak]
opt-level = "s"
# Loudness is read a few times a second; its filters are cheap either way.
[profile.release.package.ebur128]
opt-level = "s"
